# =============================================================================
# beauty-leads configuration
#
# Every number in this file is an ASSUMPTION. They are reasonable starting
# points, not facts. Tune them as you learn from real sales conversations
# (e.g. "barbershop owner on Vagaro pays ~$200/location").
# All money in the report is CAD per month unless stated otherwise.
# =============================================================================

database: data/leads.db
http_cache: data/http_cache.sqlite

http:
  # Identify yourself honestly. Put a real contact email here before running.
  user_agent: "beauty-leads/0.1 (B2B lead research; contact: CHANGE-ME@example.com)"
  timeout_seconds: 15
  per_host_delay_seconds: 1.5     # politeness delay between requests to the same site
  respect_robots_txt: true
  max_page_bytes: 2000000         # cap for crawled websites
  max_api_bytes: 300000000        # cap for API responses (Overpass / licence exports are large)
  cache_ttl_hours: 168            # re-use fetched pages for a week (saves time + API money)
  website_workers: 8              # parallel website checks (each host still rate-limited)

# -----------------------------------------------------------------------------
# Where to look
# -----------------------------------------------------------------------------
region:
  province: BC
