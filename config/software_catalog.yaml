# =============================================================================
# Booking / salon software catalog
#
# fingerprints   host (and optional path prefix) of URLs that prove a business
#                uses this software, e.g. a "Book now" link to vagaro.com or
#                a booksy.com widget. Matched on hostname, so "vagaro.com"
#                also matches "www.vagaro.com" and "widget.vagaro.com".
# pricing        rough LIST prices in `currency` per location per month.
#                  base + per_extra_staff * (staff - included_staff) + typical_addons
#                or tiers: [[max_staff, price], ...] (first tier that fits)
#                Card processing fees are NOT included anywhere.
# switchability  0-1, how winnable a typical customer is (1 = unhappy, easy to
#                move; 0 = locked in / loves it). Pure judgement — tune it.
# confidence     how sure we are of the pricing (low / medium / high).
#
# PRICES ARE ESTIMATES gathered from public comparison sites in 2026. Vendors
# change pricing often and rarely publish add-on costs. Replace them with what
# owners actually tell you on calls — that is the most valuable data you have.
# =============================================================================

currency: USD
usd_to_cad: 1.38

software:
  vagaro:
    label: Vagaro
    fingerprints: [vagaro.com]
    pricing: {base: 30, included_staff: 1, per_extra_staff: 10, typical_addons: 60}
    switchability: 0.8
    confidence: medium
    notes: >-
      ~$24-30 for 1 calendar + ~$10 per extra calendar; add-ons (forms, text
      marketing, website, check-in app, payroll) ~$10-40 each. Field data: a
      barbershop owner pays ~$200/location and is unhappy.
    pitch: "Vagaro's add-ons stack on top of the per-calendar fee. Show them one flat price with texts, forms and reminders included."

  fresha:
    label: Fresha
    fingerprints: [fresha.com, shedul.com]
    pricing: {base: 20, included_staff: 1, per_extra_staff: 15, typical_addons: 0}
    switchability: 0.7
    confidence: medium
    notes: >-
      Free plan ended 2025; now ~$20 solo or ~$15 per team member. Charges a
      ~20% one-time fee on new clients from its marketplace.
    pitch: "Fresha went from free to paid and still takes a cut of marketplace clients. Offer flat pricing with no commissions."

  booksy:
    label: Booksy
    fingerprints: [booksy.com, booksy.net]
    pricing: {base: 30, included_staff: 1, per_extra_staff: 20, typical_addons: 0}
    switchability: 0.65
    confidence: medium
    notes: "~$29.99/mo + ~$20 per extra staff. Boost marketing charges commission on new clients."
    pitch: "Booksy charges ~$20 per extra barber/stylist. Bigger teams save the most with a flat or lower per-seat price."

  square_appointments:
    label: Square Appointments
    fingerprints: [squareup.com/appointments, book.squareup.com, app.squareup.com/appointments]
    weak_fingerprints: [square.site, squareup.com]
    pricing: {tiers: [[1, 0], [999, 49]]}
    switchability: 0.35
    confidence: low
    notes: "Free for individuals; paid plans ~$49+/location. Tied into Square POS, so sticky."
    pitch: "Square is cheap, so don't lead with price. Lead with salon-specific features: deposits, no-show protection, waitlists, rebooking."

  glossgenius:
    label: GlossGenius
    fingerprints: [glossgenius.com]
    pricing: {tiers: [[1, 24], [5, 48], [999, 148]]}
    switchability: 0.4
    confidence: medium
    notes: "Tiers ~$24 / $48 / $148. Generally well liked; flat processing."
    pitch: "GlossGenius jumps to its top tier as the team grows. Price against the $148 tier for teams of 6+."

  boulevard:
    label: Boulevard
    fingerprints: [joinblvd.com, blvd.co, boulevard.io, joinboulevard.com]
    pricing: {base: 176, included_staff: 99, per_extra_staff: 0, typical_addons: 0}
    switchability: 0.25
    confidence: low
    notes: "Premium, ~$158-$400+/location, quote-based. Users tend to be happy. Hard to win."
    pitch: "Premium tool. Only worth pursuing if they complain about cost or contract terms."

  mangomint:
    label: Mangomint
    fingerprints: [mangomint.com]
    pricing: {tiers: [[1, 165], [10, 245], [999, 375]]}
    switchability: 0.2
    confidence: low
    notes: "~$165-$375/mo by team size. Highly rated. Hard to win."
    pitch: "Highly rated premium tool. Low priority unless they're price-sensitive."

  mindbody:
    label: Mindbody
    fingerprints: [mindbodyonline.com, mindbody.io, healcode.com]
    pricing: {base: 159, included_staff: 99, per_extra_staff: 0, typical_addons: 40}
    switchability: 0.5
    confidence: low
    notes: "~$139-$449+/mo; contracts common. Expensive for small salons."
    pitch: "Mindbody is built for gyms and studios and priced like it. Small salons often overpay. Check when their contract renews."

  booker:
    label: Booker (Mindbody)
    fingerprints: [booker.com]
    pricing: {base: 150, included_staff: 99, per_extra_staff: 0, typical_addons: 0}
    switchability: 0.6
    confidence: low
    notes: "Legacy Mindbody product; customers are being pushed to migrate."
    pitch: "Booker is a legacy product. If they're being forced to migrate anyway, make the switch to you instead."

