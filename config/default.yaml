# -----------------------------------------------------------------------------
# Browser recheck (`beauty-leads enrich render`): sites where the plain fetch
# found no booking software are opened in headless Chromium.
# -----------------------------------------------------------------------------
browser:
  timeout_seconds: 20
  pause_seconds: 1.0          # wait between sites
  executable_path: ""         # leave empty unless Playwright can't find Chromium

# -----------------------------------------------------------------------------
# Close CRM (`beauty-leads close push|pull`). Put your API key in the
# CLOSE_API_KEY environment variable, never in this file.
# -----------------------------------------------------------------------------
close:
  api_key_env: CLOSE_API_KEY
  base_url: https://api.close.com/api/v1
  push_tiers: [A, B]          # which tiers `close push` sends by default
  # Rename the custom fields it creates in Close, e.g. {tier: "Lead Tier"}.
  # Keys: bl_id tier expected price spend close_pct software category channel
  #       instagram reported_software reported_spend reported_staff
  field_names: {}

  # Your own Close fields, matched by name. When one exists it is filled in on
  # NEW leads (never overwritten later), and the tool doesn't create its own
  # duplicate. Delete a line, or the field in Close, to stop using it.
  existing_fields:
    tools: Current Paid Tools                # booking software + website builder + marketing tools
    spend: Est. Monthly Software Spend       # estimated $/mo for all of those (CAD)
    industry: Industry
    source: Lead Source
    website_status: Website Status           # set to "No Website" when they have none / Instagram only
    priority: Priority
    batch: Import Batch
  industry_value: Beauty & Wellness
  source_by_origin: {google: Google Maps, default: Other}
  priority_by_tier: {A: Hot, B: Warm, C: Cold, D: Cold}
  batch_label: beauty-leads                  # Import Batch = "<date> beauty-leads"
  # Detected software/tool -> choice in "Current Paid Tools". Anything not
  # listed (Booksy, GlossGenius, Squire, Jane...) becomes other_tool_choice.
  # Add those as choices in Close and map them here to track them by name.
  tool_choices:
    vagaro: Vagaro
    fresha: Fresha
    square_appointments: Square
    square_online: Square
    acuity: Acuity
    calendly: Calendly
    wix: Wix
    wix_bookings: Wix
    squarespace: Squarespace
    wordpress: WordPress
    godaddy: GoDaddy
    shopify: Shopify
    mailchimp: Mailchimp
    klaviyo: Klaviyo
    jotform: Jotform / Typeform
    typeform: Jotform / Typeform
    stripe: Stripe
  other_tool_choice: Other
  # When you change "Current Paid Tools" after a call, these choices tell
  # `close pull` which booking software they really use.
  booking_choices: {Vagaro: vagaro, Fresha: fresha, Square: square_appointments, Acuity: acuity, Calendly: calendly}

# -----------------------------------------------------------------------------
# What YOU sell. This drives "how much could we sell it for".
# -----------------------------------------------------------------------------
our_product:
  name: Our booking platform
  pricing:
    base_per_location: 79       # CAD / month / location
    included_staff: 2           # staff included in the base price
    per_extra_staff: 10         # CAD / month for each staff beyond included
    min_monthly_price: 49       # never quote below this
    # undercut: price X% below their estimated current spend (when they pay
    #           for software), but never below list * min_of_list or above
    #           list * max_over_list.
    # list:     always quote the list price above.
    strategy: undercut
    undercut_pct: 0.20
    min_of_list: 0.6            # don't chase a cheap competitor below 60% of list
    max_over_list: 1.5
  sweet_spot_staff: [2, 15]     # team sizes you serve best
  months_retained: 30           # expected customer lifetime (for LTV)

# -----------------------------------------------------------------------------
# Decision matrix
# -----------------------------------------------------------------------------
scoring:
  # close probability = min + (max - min) x switchability x decision_maker x fit^fit_exponent
  #
  # switchability and decision_maker are GATES: they multiply, because a shop
  # that loves its software, or a franchise whose head office picks the
  # software, is a poor lead no matter how good everything else looks.
  # fit is the weighted average of the other factors (weights below).
  # max = the chance of winning a perfect lead you actually pitch. Calibrate
  # it against your real win rate after your first 20-30 pitches.
  close_probability: {min: 0.01, max: 0.35}
  fit_exponent: 1.5             # >1 spreads good leads apart from average ones
  # Salons typically spend roughly 1-3% of revenue on software; used as the
  # "can they afford it" budget.
  software_budget_pct_of_revenue: 0.02
  price_level_multiplier:
    PRICE_LEVEL_INEXPENSIVE: 0.85
    PRICE_LEVEL_MODERATE: 1.0
    PRICE_LEVEL_EXPENSIVE: 1.25
    PRICE_LEVEL_VERY_EXPENSIVE: 1.5
  staff_bounds: [1, 40]
  # Gates (0-1, from config/software_catalog.yaml and chain/franchise status):
  #   switchability   how unhappy / locked-in users of their current software are
  #   decision_maker  independent 1.0, 2-5 locations 0.85, 6+ 0.5, franchise 0.15
  decision_maker: {independent: 1.0, small_chain: 0.85, large_chain: 0.5, franchise: 0.15}
  weights:                 # fit factors (0-1 each), weighted average
    savings: 2.0           # how much cheaper we are than what they pay now
    affordability: 2.0     # their est. software budget vs our price
    size_fit: 1.5          # team size inside our sweet spot
    business_volume: 1.5   # busy shops (reviews) feel scheduling pain most
    stability: 1.0         # years registered, operating status
    reachability: 1.5      # can we reach them by email / Instagram (see below)
    category_fit: 1.0      # barber vs nails vs tanning fit for our product
  # Reachability = sum of the channels we have (max 1.0). Weighted toward
  # email and Instagram DMs, your main outreach channels.
  reachability: {email: 0.4, instagram: 0.35, phone: 0.15, website: 0.1}
  exclude_franchises: false
  # Tier thresholds on expected monthly value (CAD/mo)
  tiers: {A: 30, B: 15, C: 6}
