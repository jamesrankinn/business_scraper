sources:
  google_places:
    # Set GOOGLE_MAPS_API_KEY in your environment (never commit keys).
    api_key_env: GOOGLE_MAPS_API_KEY
    search_terms:
      - barber shop
      - hair salon
      - nail salon
      - tanning salon
      - lash extensions
      - brow bar
      - esthetics
      - waxing studio
      - day spa
      - beauty salon
    max_pages_per_query: 3        # Google returns max 20 results/page, 60/query
    # Hard stop so a typo can't run up a bill. Each page = 1 billable request.
    max_requests_per_run: 300

  osm:
    overpass_url: https://overpass-api.de/api/interpreter
    area_iso: CA-BC

  vancouver_licences:
    base_url: https://opendata.vancouver.ca/api/explore/v2.1/catalog/datasets
    dataset: business-licences
    # Licence business types/subtypes are matched against these keywords
    # (the City consolidated its categories in 2024, so we match loosely and
    # then classify each business by name).
    type_keywords: [barber, beauty, hair, nail, esthetic, aesthetic, tanning, cosmetic, spa, salon, personal service]
    only_status: Issued

  orgbook:
    base_url: https://orgbook.gov.bc.ca/api/v4
    # OrgBook returns at most 1,000 results per search (10 pages of 100), so
    # overlapping specific terms reach further than one broad term.
    search_terms: [barber, barbershop, "barber shop", barbering, salon, "hair salon", "hair studio",
                   hair, hairstyling, nails, "nail salon", "nail bar", "nail studio", tanning,
                   "tan studio", esthetics, aesthetics, lash, lashes, brow, brows, beauty,
                   "beauty salon", spa, "day spa", waxing]
    max_pages_per_term: 10        # 100 results/page; OrgBook stops at page 10
    # Registry names have no business type, and "Barber" is also a surname.
    # Names containing any of these words are skipped.
    exclude_words: [motors, motor, auto, automotive, road, fit, fitness, construction, contracting,
                    plumbing, electric, electrical, trucking, transport, realty, properties, property,
                    farm, farms, logging, excavating, roofing, painting, law, legal, accounting,
                    dental, developments, homes, investments, hotel, restaurant, cafe, pub, golf,
                    products, supply, supplies, distribution, distributors, wholesale, imports]

# -----------------------------------------------------------------------------
# Business categories. Order = priority when a name scores equally for several
# ("Hair & Nails" -> hair salon).
#   keywords       strong signals in the business name / types
#   weak_keywords  count half (e.g. "salon" alone)
#   fit            how well this category fits what you sell (0-1)
#   default_staff  used when we have no better staff estimate
#   revenue_per_staff_cad  annual service revenue per working chair/tech
#   reviews_per_staff      Google reviews per staff member (staff estimate)
# -----------------------------------------------------------------------------
categories:
  barber:
    label: Barbershop
    keywords: [barber, barbers, barbershop, barbering, fade, fades, "men's grooming", gentlemen, gents]
    google_types: [barber_shop]
    osm_tags: {hairdresser: [barber]}
    fit: 1.0
    default_staff: 3
    revenue_per_staff_cad: 65000
    reviews_per_staff: 60
  tanning:
    label: Tanning
    keywords: [tanning, "spray tan", "tan studio", "tan bar", sunless, bronze, bronzed, airbrush tan]
    google_types: [tanning_studio]
    osm_tags: {beauty: [tanning], leisure: [tanning_salon], shop: [tanning]}
    fit: 0.7
    default_staff: 2
    revenue_per_staff_cad: 80000
    reviews_per_staff: 100
  hair_salon:
    label: Hair salon
    keywords: [hair, hairstylist, hairdresser, coiffure, blowout, "blow dry", balayage, colour, color, cuts]
    weak_keywords: [salon, studio, stylist]
    google_types: [hair_salon, hair_care]
    osm_tags: {shop: [hairdresser]}
    fit: 1.0
    default_staff: 4
    revenue_per_staff_cad: 80000
    reviews_per_staff: 50
  nails:
    label: Nail salon
    keywords: [nail, nails, manicure, pedicure, "mani pedi", "nail bar"]
    google_types: [nail_salon]
    osm_tags: {beauty: [nails]}
    fit: 0.85
    default_staff: 4
    revenue_per_staff_cad: 50000
    reviews_per_staff: 50
  lash_brow:
    label: Lash & brow
    keywords: [lash, lashes, eyelash, brow, brows, microblading, threading, "lash lift"]
    google_types: []
    osm_tags: {beauty: [lashes, eyelashes, eyebrows, brows]}
    fit: 0.9
    default_staff: 2
    revenue_per_staff_cad: 60000
    reviews_per_staff: 40
  esthetics_spa:
    label: Esthetics / spa
    keywords: [esthetic, esthetics, aesthetic, aesthetics, spa, facial, facials, skin, skincare, wax, waxing, laser, "med spa", medispa, beauty, makeup, cosmetic]
    google_types: [spa, beauty_salon, beautician, skin_care_clinic, makeup_artist]
    osm_tags: {shop: [beauty], beauty: [spa, waxing, cosmetics, skin_care, facial]}
    fit: 0.85
    default_staff: 3
    revenue_per_staff_cad: 70000
    reviews_per_staff: 50

