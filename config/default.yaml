  # control API cost; start with your home market.
  cities:
    # Lower Mainland / Fraser Valley
    - Vancouver
    - Surrey
    - Burnaby
    - Richmond
    - Coquitlam
    - Port Coquitlam
    - Port Moody
    - New Westminster
    - North Vancouver
