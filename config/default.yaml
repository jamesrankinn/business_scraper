# =============================================================================
# beauty-leads configuration
#
# Every number in this file is an ASSUMPTION. They are reasonable starting
# points, not facts. Tune them as you learn from real sales conversations
# (e.g. "barbershop owner on Vagaro pays ~$200/location").
# All money in the report is CAD per month unless stated otherwise.
# =============================================================================

database: data/leads.db
http_cache: data/http_cache.sqlite

http:
  # Identify yourself honestly. Put a real contact email here before running.
  user_agent: "beauty-leads/0.1 (B2B lead research; contact: CHANGE-ME@example.com)"
  timeout_seconds: 15
  per_host_delay_seconds: 1.5     # politeness delay between requests to the same site
  respect_robots_txt: true
  max_page_bytes: 2000000         # cap for crawled websites
  max_api_bytes: 300000000        # cap for API responses (Overpass / licence exports are large)
  cache_ttl_hours: 168            # re-use fetched pages for a week (saves time + API money)
  website_workers: 8              # parallel website checks (each host still rate-limited)

# -----------------------------------------------------------------------------
# Where to look
# -----------------------------------------------------------------------------
region:
  province: BC
  # Google Places is searched once per (city x search term). Trim this list to
  # control API cost; start with your home market.
  cities:
    # Lower Mainland / Fraser Valley
    - Vancouver
    - Surrey
    - Burnaby
    - Richmond
    - Coquitlam
    - Port Coquitlam
    - Port Moody
    - New Westminster
    - North Vancouver
    - West Vancouver
    - Delta
    - Langley
    - White Rock
    - Maple Ridge
    - Pitt Meadows
    - Abbotsford
    - Mission
    - Chilliwack
    - Squamish
    - Whistler
    # Vancouver Island
    - Victoria
    - Saanich
    - Langford
    - Colwood
    - Sidney
    - Duncan
    - Nanaimo
    - Parksville
    - Port Alberni
    - Courtenay
    - Comox
    - Campbell River
    # Interior / North
    - Kelowna
    - West Kelowna
    - Vernon
    - Penticton
    - Summerland
    - Kamloops
    - Salmon Arm
    - Merritt
    - Cranbrook
    - Nelson
    - Castlegar
    - Trail
    - Fernie
    - Revelstoke
    - Prince George
    - Quesnel
    - Williams Lake
    - Fort St. John
    - Dawson Creek
    - Terrace
    - Prince Rupert
    - Smithers
    - Kitimat
    - Powell River
    - Sechelt
    - Gibsons
    - Hope

sources:
  google_places:
    # Set GOOGLE_MAPS_API_KEY in your environment (never commit keys).
    api_key_env: GOOGLE_MAPS_API_KEY
    search_terms:
      - barber shop
      - hair salon
      - nail salon
      - tanning salon
      - lash extensions
      - brow bar
      - esthetics
      - waxing studio
      - day spa
      - beauty salon
      - tattoo shop
      - massage therapy
      - registered massage therapist
      - med spa
      - laser clinic
    max_pages_per_query: 3        # Google returns max 20 results/page, 60/query
    # Hard stop so a typo can't run up a bill. Each page = 1 billable request.
    max_requests_per_run: 300

  osm:
    overpass_url: https://overpass-api.de/api/interpreter
    area_iso: CA-BC

  vancouver_licences:
    base_url: https://opendata.vancouver.ca/api/explore/v2.1/catalog/datasets
    dataset: business-licences
    # Licence business types/subtypes are matched against these keywords
    # (the City consolidated its categories in 2024, so we match loosely and
    # then classify each business by name).
    type_keywords: [barber, beauty, hair, nail, esthetic, aesthetic, tanning, cosmetic, spa, salon,
                    massage, tattoo, personal service]
    only_status: Issued

  orgbook:
    base_url: https://orgbook.gov.bc.ca/api/v4
    # OrgBook returns at most 1,000 results per search (10 pages of 100), so
    # overlapping specific terms reach further than one broad term.
    search_terms: [barber, barbershop, "barber shop", barbering, salon, "hair salon", "hair studio",
                   hair, hairstyling, nails, "nail salon", "nail bar", "nail studio", tanning,
                   "tan studio", esthetics, aesthetics, lash, lashes, brow, brows, beauty,
                   "beauty salon", spa, "day spa", waxing, tattoo, tattoos, piercing, massage,
                   "massage therapy", rmt, "med spa", medspa, "medical aesthetics", laser, botox]
    max_pages_per_term: 10        # 100 results/page; OrgBook stops at page 10
    # Registry names have no business type, and "Barber" is also a surname.
    # Names containing any of these words are skipped.
    exclude_words: [motors, motor, auto, automotive, road, fit, fitness, construction, contracting,
                    plumbing, electric, electrical, trucking, transport, realty, properties, property,
                    farm, farms, logging, excavating, roofing, painting, law, legal, accounting,
                    dental, developments, homes, investments, hotel, restaurant, cafe, pub, golf,
                    products, supply, supplies, distribution, distributors, wholesale, imports]

# -----------------------------------------------------------------------------
# Business categories. Order = priority when a name scores equally for several
# ("Hair & Nails" -> hair salon).
#   keywords       strong signals in the business name / types
#   weak_keywords  count half (e.g. "salon" alone)
#   fit            how well this category fits what you sell (0-1). All 1.0: you
#                  serve every category. Lower one to push it down the list.
#   default_staff  used when we have no better staff estimate
#   revenue_per_staff_cad  annual service revenue per working chair/tech
#   reviews_per_staff      Google reviews per staff member (staff estimate)
#   noun           how outreach messages refer to the business ("barbershop")
# -----------------------------------------------------------------------------
categories:
  barber:
    label: Barbershop
    noun: barbershop
    keywords: [barber, barbers, barbershop, barbering, fade, fades, "men's grooming", gentlemen, gents]
    google_types: [barber_shop]
    osm_tags: {hairdresser: [barber]}
    fit: 1.0
    default_staff: 3
    revenue_per_staff_cad: 65000
    reviews_per_staff: 60
  tanning:
    label: Tanning
    noun: tanning studio
    keywords: [tanning, "spray tan", "tan studio", "tan bar", sunless, bronze, bronzed, airbrush tan]
    google_types: [tanning_studio]
    osm_tags: {beauty: [tanning], leisure: [tanning_salon], shop: [tanning]}
    fit: 1.0
    default_staff: 2
    revenue_per_staff_cad: 80000
    reviews_per_staff: 100
  tattoo:
    label: Tattoo & piercing
    noun: tattoo studio
    keywords: [tattoo, tattoos, tattooing, ink, piercing, piercings, "body art", "body piercing"]
    google_types: [tattoo_shop, body_art_service]
    osm_tags: {shop: [tattoo]}
    fit: 1.0
    default_staff: 4
    revenue_per_staff_cad: 90000
    reviews_per_staff: 60
  hair_salon:
    label: Hair salon
    noun: salon
    keywords: [hair, hairstylist, hairdresser, coiffure, blowout, "blow dry", balayage, colour, color, cuts]
    weak_keywords: [salon, studio, stylist]
    google_types: [hair_salon, hair_care]
    osm_tags: {shop: [hairdresser]}
    fit: 1.0
    default_staff: 4
    revenue_per_staff_cad: 80000
    reviews_per_staff: 50
  nails:
    label: Nail salon
    noun: nail salon
    keywords: [nail, nails, manicure, pedicure, "mani pedi", "nail bar"]
    google_types: [nail_salon]
    osm_tags: {beauty: [nails]}
    fit: 1.0
    default_staff: 4
    revenue_per_staff_cad: 50000
    reviews_per_staff: 50
  lash_brow:
    label: Lash & brow
    noun: lash studio
    keywords: [lash, lashes, eyelash, brow, brows, microblading, threading, "lash lift"]
    google_types: []
    osm_tags: {beauty: [lashes, eyelashes, eyebrows, brows]}
    fit: 1.0
    default_staff: 2
    revenue_per_staff_cad: 60000
    reviews_per_staff: 40
  med_spa:
    label: Med spa
    noun: med spa
    keywords: ["med spa", medspa, medispa, "medical spa", "medical aesthetics", "medical aesthetic",
               botox, injectables, injector, filler, fillers, laser, "laser clinic", "skin clinic",
               "cosmetic clinic", "aesthetic clinic", "aesthetics clinic", coolsculpting, hydrafacial]
    google_types: [medical_spa]
    osm_tags: {"healthcare:speciality": [cosmetic, aesthetic_medicine]}
    fit: 1.0
    default_staff: 4
    revenue_per_staff_cad: 180000
    reviews_per_staff: 40
  massage:
    label: Massage
    noun: massage clinic
    keywords: [massage, rmt, "registered massage", "massage therapy", reflexology, shiatsu, "deep tissue", bodywork]
    google_types: [massage, massage_therapist, massage_spa]
    osm_tags: {shop: [massage], "healthcare:speciality": [massage_therapy]}
    fit: 1.0
    default_staff: 4
    revenue_per_staff_cad: 65000
    reviews_per_staff: 35
  esthetics_spa:
    label: Esthetics / spa
    noun: spa
    keywords: [esthetic, esthetics, aesthetic, aesthetics, spa, facial, facials, skin, skincare, wax, waxing, beauty, makeup, cosmetic]
    google_types: [spa, beauty_salon, beautician, skin_care_clinic, makeup_artist]
    osm_tags: {shop: [beauty], beauty: [spa, waxing, cosmetics, skin_care, facial]}
    fit: 1.0
    default_staff: 3
    revenue_per_staff_cad: 70000
    reviews_per_staff: 50

# Businesses whose name or licence type contains any of these are dropped:
# adult "body rub" businesses, dental clinics, pet groomers, supply wholesalers.
exclude_keywords: ["body rub", "body-rub", bodyrub, erotic, sensual, dental, dentist, dentistry,
                   orthodontic, orthodontics, veterinary, "pet grooming", "dog grooming",
                   "beauty supply", "beauty supplies", "salon supply", "barber supply", wholesale]

