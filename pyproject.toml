[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beauty-leads"
version = "0.1.0"
description = "Find beauty-industry businesses in BC, detect their booking software, and score them with a sales decision matrix."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
beauty-leads = "beauty_leads.cli:main"

[tool.setuptools.packages.find]
include = ["beauty_leads*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
