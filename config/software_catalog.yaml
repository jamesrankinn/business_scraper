# Pseudo-software states when no booking platform was found.
no_software:
  none_detected:
    label: No online booking found (phone/DM)
    switchability: 0.55
    pitch: "No online booking found. Pitch fewer no-shows, 24/7 booking and less time on the phone. Start them on the base plan."
  social_only:
    label: Instagram / social only
    switchability: 0.5
    pitch: "They book through Instagram DMs. Pitch a booking link for their bio, with deposits to cut no-shows."
  no_website:
    label: No website
    switchability: 0.45
    pitch: "No web presence. Pitch a simple booking page they can share, and walk them through setup."
  unknown:
    label: Unknown (not checked yet)
    switchability: 0.5
    pitch: "Software unknown. Ask what they use for booking and what it costs them per month."

